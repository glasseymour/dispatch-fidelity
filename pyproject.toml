[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-fidelity"
version = "0.3.1rc1"
description = "Did your agent actually call what it says it called? A dispatch-fidelity audit for agentic systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Zoltan Varga" }]
keywords = [
    "llm", "agents", "multi-agent", "tool-use", "audit", "evaluation",
    "hallucination", "observability", "provenance", "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies, on purpose. An audit instrument that drags in a dependency
# tree is a bigger attack surface than the thing it measures, and it cannot be dropped
# into a locked-down environment where audits are most often needed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/glasseymour/dispatch-fidelity"
Method = "https://doi.org/10.5281/zenodo.21812041"
Issues = "https://github.com/glasseymour/dispatch-fidelity/issues"

[project.scripts]
dispatch-audit = "dispatch_fidelity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
