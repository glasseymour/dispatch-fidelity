name: ci

# The claim this workflow makes is narrow and checkable: on a clean machine, with nothing
# but the standard library, the tests pass, the instrument validates itself against known
# defects, and the demo catches a lying agent. Anything broader would be a claim nobody
# runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Validation matrix
        run: dispatch-audit selftest --with-evidence
      - name: Demo catches the lying agent
        run: dispatch-audit demo

  dogfood:
    # The evidence-discipline module, run on this repository. If the guards are worth
    # asking others to adopt, they are worth passing here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Record the test run
        run: dispatch-audit gate --label tests -- pytest -q
      - name: Verify the recording binds to this tree
        run: dispatch-audit verify
