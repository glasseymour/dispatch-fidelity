name: publish

# PyPI Trusted Publishing: no token lives in this repository, and none has to. PyPI
# verifies the workflow identity directly, so the credential that would otherwise sit in
# a secret does not exist to be leaked.
#
# `workflow_dispatch` is here because v0.3.0 shipped before this workflow did. A release
# that already exists can be published by firing this manually against its tag.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build first, then prove the built artifact works. Publishing something that was
      # never run from its own wheel is the packaging version of shipping an unexecuted
      # check -- and this project has a finding number for that shape.
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/dispatch-audit selftest
          /tmp/clean/bin/dispatch-audit demo

      - name: Checksums
        run: sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # configure the trusted publisher against this environment
    permissions:
      id-token: write          # the OIDC token PyPI checks; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
